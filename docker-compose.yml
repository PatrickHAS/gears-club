services:
  postgres:
    image: postgres:17-alpine
    container_name: gears_club_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gears_club
      POSTGRES_PASSWORD: gears_club_dev
      POSTGRES_DB: gears_club
    ports:
      - "5434:5432"
    volumes:
      - gears_club_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gears_club -d gears_club"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gears_club_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gears_club_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gears_club_postgres_data:
  gears_club_redis_data:
